<div class="auth-wrapper">
  <div class="auth-card">
    <ng-container *ngIf="step === 'form'">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to manage your finances</p>

      <div class="alert alert-error" *ngIf="error">{{ error }}</div>

      <form (ngSubmit)="submitSignin()">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" [(ngModel)]="password" name="password" placeholder="Your password" />
        </div>

        <div class="between-row">
          <span></span>
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
          <span class="spinner" *ngIf="loading"></span>
          {{ loading ? 'Checking...' : 'Sign In' }}
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/signup">Sign up</a>
      </div>
    </ng-container>

    <ng-container *ngIf="step === 'otp'">
      <h1 class="auth-title">Verify it's you</h1>
      <p class="otp-hint">We sent a 6-digit code to <strong>{{ email }}</strong></p>

      <div class="alert alert-error" *ngIf="error">{{ error }}</div>
      <div class="alert alert-success" *ngIf="success">{{ success }}</div>

      <form (ngSubmit)="submitOtp()">
        <div class="form-group">
          <label>OTP Code</label>
          <input class="form-control" type="text" maxlength="6" [(ngModel)]="otpCode" name="otpCode" placeholder="123456" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
          <span class="spinner" *ngIf="loading"></span>
          {{ loading ? 'Verifying...' : 'Verify & Sign In' }}
        </button>
      </form>

      <div class="auth-footer">
        Didn't get a code? <button class="link-btn" (click)="resendOtp()">Resend OTP</button>
      </div>
    </ng-container>
  </div>
</div>
