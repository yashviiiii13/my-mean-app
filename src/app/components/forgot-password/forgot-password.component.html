<div class="auth-wrapper">
  <div class="auth-card">
    <ng-container *ngIf="step === 'request'">
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you an OTP</p>

      <div class="alert alert-error" *ngIf="error">{{ error }}</div>

      <form (ngSubmit)="requestOtp()">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
          <span class="spinner" *ngIf="loading"></span>
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a routerLink="/signin">Sign in</a>
      </div>
    </ng-container>

    <ng-container *ngIf="step === 'reset'">
      <h1 class="auth-title">Reset password</h1>
      <p class="otp-hint">Enter the OTP sent to <strong>{{ email }}</strong> and your new password</p>

      <div class="alert alert-error" *ngIf="error">{{ error }}</div>
      <div class="alert alert-success" *ngIf="success">{{ success }}</div>

      <form (ngSubmit)="resetPassword()">
        <div class="form-group">
          <label>OTP Code</label>
          <input class="form-control" type="text" maxlength="6" [(ngModel)]="otpCode" name="otpCode" placeholder="123456" />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input class="form-control" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="At least 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input class="form-control" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
          <span class="spinner" *ngIf="loading"></span>
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>

      <div class="auth-footer">
        Didn't get a code? <button class="link-btn" (click)="resendOtp()">Resend OTP</button>
      </div>
    </ng-container>
  </div>
</div>
